name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: friday-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Re-publish a "latest" release so the APK is a direct download on the phone.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk friday.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest friday.apk --prerelease \
            --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Built from $GITHUB_SHA"
